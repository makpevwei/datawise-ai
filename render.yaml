services:
  - type: web
    name: datawise-ai-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: datawise-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datawise-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: DOCUMENT_DIR
        value: /data/documents
      - key: REPORTS_DIR
        value: /data/reports
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: datawise-postgres
    plan: starter
    databaseName: datawise
    user: datawise
