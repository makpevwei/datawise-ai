<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>DataWise AI — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9f9f7;
      color: #1a1a18;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #0f766e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 32px;
      font-weight: 700;
    }
    h1 { font-size: 1.25rem; font-weight: 700; }
    p  { font-size: 0.9rem; color: #6b6a63; max-width: 320px; line-height: 1.6; }
    button {
      margin-top: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #0f766e;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">D</div>
  <h1>You're offline</h1>
  <p>DataWise AI needs a connection to analyse your data. Check your network and try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
