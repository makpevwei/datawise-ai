name: CI

# Runs on every push and PR touching main. Vercel is not told about this
# workflow directly -- there's no native "wait for a GitHub Action" hook on
# Vercel's side. The intended guarantee is that GitHub branch protection on
# main (Require status checks to pass -> the "backend" and "frontend" jobs
# below, enforced for everyone including admins, combined with main only
# accepting merges via PR) is what actually keeps a broken build off
# Vercel's production deploy. NOT CURRENTLY ENABLED: GitHub blocks branch
# protection on a private repo below the Pro plan, and the deliberate
# choice (see TODO.md) was to stay private and free rather than pay or go
# public. Until that's revisited, a direct push to main -- red CI or not
# -- still reaches Vercel same as before this phase.
#
# The backend has no such external auto-deploy -- the `deploy` job below
# *is* its deploy mechanism, gated the same way regardless of branch
# protection: it only runs after `backend` and `frontend` both succeed on
# main itself, and only on an actual push to main (never on a PR, so a PR
# from a fork can't deploy anything). Authenticates to GCP via Workload
# Identity Federation (no long-lived service-account key stored in
# GitHub) -- see docs/deploy-pipeline.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The test suite exercises the real Postgres-backed models (auth,
    # dataset/document ownership, sessions, reports, ...), not just the
    # file-backed stores -- a real Postgres service container here, not a
    # mock, mirrors what the deployed backend actually runs against.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datawise
          POSTGRES_PASSWORD: datawise
          POSTGRES_DB: datawise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://datawise:datawise@localhost:5432/datawise_test
      JWT_SECRET_KEY: ci-test-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Mirrors backend/Dockerfile -- poppler-utils/tesseract-ocr back
        # PDF OCR fallback and are asserted present by
        # tests/test_document_extraction.py::test_ocr_available_in_current_environment.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/.python-version"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Type-check (mypy, advisory only)
        # continue-on-error: the codebase has no prior type-checking history
        # (39 pre-existing errors across 16 files as of the CI gate's
        # introduction, none related to any change that added this gate).
        # Runs on every build so real regressions are visible in the log,
        # but doesn't block merges/deploys on a backlog that needs its own
        # dedicated cleanup pass first. See TODO.md.
        run: uv run mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Test
        # --reruns 1: the suite has pre-existing cross-test contamination
        # (module-level TestClient(app) + mutable app.dependency_overrides
        # shared across many test files, order-dependent -- confirmed by
        # running the full suite locally twice and getting two DIFFERENT
        # sets of failures both times, with every individually-failing
        # test passing cleanly in isolation). Not something this phase
        # introduced or is in scope to fix; a real fix (per-test client
        # fixtures instead of shared module state) is tracked in TODO.md.
        # A single rerun is a stopgap so a known-flaky, order-dependent
        # failure doesn't block CI on tests that are individually correct.
        run: uv run pytest tests/ -q -m "not live" --reruns 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Also generates Next.js's typed-routes types (e.g. LayoutProps<...>)
        # into .next/types -- those only exist after a build/dev run, so
        # this has to happen before the standalone type-check below, or
        # tsc fails on names that are real in any actual dev/deploy but
        # don't exist yet in a fresh checkout.
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # id-token: write is what lets this job exchange its GitHub-issued OIDC
    # token for short-lived GCP credentials via Workload Identity
    # Federation -- no service-account key ever stored in GitHub.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Write env-vars file
        # Never interpolate a secret directly into a quoted shell string in
        # a `run:` script -- CORS_ORIGINS' value is a JSON array containing
        # literal double quotes, which would prematurely close the
        # surrounding "--update-env-vars=\"...\"" string and corrupt the
        # value gcloud actually receives (this is exactly what happened on
        # the first run of this workflow: cors_origins failed to parse as
        # JSON on the backend, because it never arrived intact). Passing
        # every secret through `env:` instead keeps it as a real,
        # unmangled environment variable; this step writes them to a YAML
        # file the same way env-vars-file already worked when run by hand.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          UPLOAD_DIR: ${{ secrets.UPLOAD_DIR }}
          DOCUMENT_DIR: ${{ secrets.DOCUMENT_DIR }}
          REPORTS_DIR: ${{ secrets.REPORTS_DIR }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
        run: |
          python3 -c "
          import json, os
          # JSON is valid YAML, so this needs only the stdlib -- no
          # dependency on pyyaml being present on the runner.
          names = ['DATABASE_URL','JWT_SECRET_KEY','ENVIRONMENT','LLM_PROVIDER','LLM_API_KEY','OPENAI_API_KEY','CORS_ORIGINS','EMBEDDING_PROVIDER','FRONTEND_BASE_URL','UPLOAD_DIR','DOCUMENT_DIR','REPORTS_DIR','SMTP_HOST','SMTP_PORT','SMTP_USERNAME','SMTP_PASSWORD','SMTP_FROM_EMAIL']
          with open('/tmp/deploy-env.yaml', 'w') as f:
              json.dump({n: os.environ[n] for n in names}, f)
          "

      - name: Deploy to Cloud Run
        # Mirrors the manual `gcloud run deploy` command exactly (memory,
        # CPU, min-instances, execution environment, GCS volume mount for
        # persistent storage) -- see docs/deploy-pipeline.md for what each
        # flag is for.
        run: |
          gcloud run deploy datawise-ai-backend \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --source=. \
            --region=us-west1 \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=1 \
            --execution-environment=gen2 \
            --add-volume=name=data,type=cloud-storage,bucket=datawise-ai-storage-agentic \
            --add-volume-mount=volume=data,mount-path=/data \
            --env-vars-file=/tmp/deploy-env.yaml \
            --quiet
