[project]
name = "datawise-ai-backend"
version = "0.1.0"
description = "DataWise AI - AI-powered Business Intelligence and Data Analysis platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pyarrow>=25.0.1",
    "anthropic>=1.0.0",
    "openai>=3.3.1",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.9.0",
    "reportlab>=5.0.1",
    "psycopg[binary]>=3.3.4",
    "asyncpg>=0.30.0",
    "alembic>=1.19.1",
    "torch>=2.2,<2.3",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.0",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers<4",
    "numpy<2",
    "beautifulsoup4>=4.15.0",
    "bcrypt>=4.0",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: real network calls to a configured LLM provider (skipped automatically when its key is unset). Use `-m \"not live\"` for a network-free run.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
